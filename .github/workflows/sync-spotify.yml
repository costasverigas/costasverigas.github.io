name: Refresh Spotify portfolio

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - scripts/sync_spotify.py
      - .github/workflows/sync-spotify.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: spotify-portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check initial Spotify setup
        id: setup
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          if [ -n "$SPOTIFY_CLIENT_ID" ] && [ -n "$SPOTIFY_REFRESH_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Initial setup needed: open spotify-connect.html and add the two Spotify secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - if: steps.setup.outputs.ready == 'true'
        run: python -m pip install 'Pillow>=11,<13' 'cryptography>=44,<48'
      - if: steps.setup.outputs.ready == 'true'
        run: python -m unittest discover -s tests -v
      - name: Read playlist and remove repeated artwork
        id: sync
        if: steps.setup.outputs.ready == 'true'
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python scripts/sync_spotify.py
      - name: Save changed covers and encrypted token rotation
        id: save
        if: always() && steps.sync.outcome != 'skipped'
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$SYNC_OUTCOME" = 'success' ]; then
            git add playlist-covers.json playlist-covers.js
          fi
          if [ -f spotify-refresh.enc.json ]; then git add spotify-refresh.enc.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Spotify portfolio data"
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh the published GitHub Pages site
        if: always() && (github.event_name == 'workflow_dispatch' || steps.save.outputs.changed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq .status
      - name: Report incomplete sync
        if: steps.sync.outcome == 'failure'
        run: |
          echo 'Spotify sync was not completed. See the safe diagnostic in the playlist step.'
          exit 1
