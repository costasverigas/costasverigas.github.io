name: Check Muso connection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-muso.yml

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check workspace access without exposing the key
        env:
          MUSO_WORKSPACE_KEY: ${{ secrets.MUSO_WORKSPACE_KEY }}
          MUSO_PROFILE_ID: f0d86587-9bc1-49be-bd45-78d3321f1f8f
        shell: bash
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os
          import re
          import sys

          def report(message):
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(message + '\n\n')

          key = os.environ.get('MUSO_WORKSPACE_KEY', '').strip()
          if not key:
              report('Missing repository secret: MUSO_WORKSPACE_KEY.')
              sys.exit(1)

          connection = http.client.HTTPSConnection('api.muso.ai', timeout=30)
          try:
              connection.request('GET', '/api/c/v4a/workspace/roster',
                  headers={'workspace-api-key': key, 'Accept': 'application/json'})
              response = connection.getresponse()
              report('Muso workspace endpoint HTTP status: ' + str(response.status))
              if response.status != 200:
                  error_body = response.read(65536).decode('utf-8', errors='replace').lower()
                  content_type = response.getheader('Content-Type', '').lower()
                  report('Error response format: ' + ('JSON' if 'json' in content_type else 'HTML' if 'html' in content_type else 'other'))
                  markers = {
                      'invalid api key': 'invalid API key',
                      'invalid_api_key': 'invalid API key',
                      'expired': 'expiry mentioned',
                      'workspace': 'workspace mentioned',
                      'unauthorized': 'unauthorized',
                      'forbidden': 'forbidden',
                      'cloudfront': 'CloudFront response',
                      'request blocked': 'request blocked by service',
                      'access denied': 'access denied',
                      'subscription': 'subscription mentioned',
                      'permission': 'permission mentioned',
                      'api key': 'API key mentioned',
                      'api-key': 'API key mentioned',
                  }
                  hints = sorted({label for marker, label in markers.items() if marker in error_body})
                  report('Service error indicators: ' + (', '.join(hints) if hints else 'none recognized'))
                  try:
                      error_data = json.loads(error_body)
                  except ValueError:
                      error_data = {}
                  def safe_errors(value, depth=0):
                      if depth > 4:
                          return
                      if isinstance(value, dict):
                          for field, item in value.items():
                              if field in ('message', 'error', 'code', 'status', 'statuscode'):
                                  if isinstance(item, (int, bool)):
                                      report('Service ' + field + ': ' + str(item))
                                  elif isinstance(item, str):
                                      safe = item.replace(key.lower(), '[redacted]')
                                      if re.fullmatch(r'[a-zA-Z .,:;_/-]{1,160}', safe) and not re.search(r'[a-zA-Z_-]{35,}', safe):
                                          report('Service ' + field + ': ' + safe)
                              if isinstance(item, (dict, list)):
                                  safe_errors(item, depth + 1)
                      elif isinstance(value, list):
                          for item in value[:5]:
                              safe_errors(item, depth + 1)
                  safe_errors(error_data)
                  report('Connection not verified. Credentials were not logged.')
                  sys.exit(1)
              body = response.read(2 * 1024 * 1024 + 1)
              if len(body) > 2 * 1024 * 1024:
                  report('Response exceeded the diagnostic size limit.')
                  sys.exit(1)
              data = json.loads(body)
          except (OSError, http.client.HTTPException, ValueError):
              report('Could not retrieve a valid JSON response. No credentials were logged.')
              sys.exit(1)
          finally:
              connection.close()

          target = os.environ['MUSO_PROFILE_ID']
          matched = []
          def visit(value):
              if isinstance(value, dict):
                  if any(isinstance(item, str) and item == target for item in value.values()):
                      matched.append(value)
                  for child in value.values():
                      visit(child)
              elif isinstance(value, list):
                  for child in value:
                      visit(child)
          visit(data)

          report('Workspace access verified. Target profile found: ' + ('yes' if matched else 'not in this response'))
          if matched:
              fields = sorted({field for item in matched for field in item
                  if re.fullmatch(r'[A-Za-z][A-Za-z0-9_]{0,70}', field)})
              report('Available profile field names: ' + ', '.join(fields))
          report('This check does not publish or store Muso analytics and does not change the website.')
          PY
